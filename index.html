<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Robot Control</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            margin-top: 30px;
        }

        button {
            width: 120px;
            height: 70px;
            margin: 8px;
            font-size: 22px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }

        #connect {
            width: 250px;
            background: green;
            color: white;
        }

        .control {
            background: #2196F3;
            color: white;
        }

        .stop {
            background: red;
            color: white;
        }

        #status {
            font-size: 20px;
            margin: 20px;
        }
        .p2 {
            position=fixed;
            bottom = 20px;
            right = 20px;
            border-radius: 40px;
            border: solid;
            border-color: black;
        }
    </style>
</head>

<body>

    <h1>ESP32 Robot Control</h1>

    <button id="connect">Connect to ESP32</button>

    <p id="status">Disconnected</p>

    <br><br>

    <div>
        <button class="control" id="forward">▲<br>Forward</button>
    </div>

    <div>
        <button class="control" id="left">◀<br>Left</button>

        <button class="stop" id="stop">STOP</button>

        <button class="control" id="right">▶<br>Right</button>
        
    </div>
    <a href = "pickplace.html" class="p2">
    <button>p2</button>
    </a>    
    <div>
        <button class="control" id="backward">▼<br>Backward</button>
    </div>

    <script>

        let device;
        let characteristic;

        const SERVICE_UUID =
            "12345678-1234-1234-1234-123456789abc";

        const CHARACTERISTIC_UUID =
            "abcdefab-1234-1234-1234-123456789abc";

        // Connect to ESP32
        document.getElementById("connect").addEventListener("click", async () => {

            try {

                device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { services: [SERVICE_UUID] }
                    ]
                });

                const server = await device.gatt.connect();

                const service =
                    await server.getPrimaryService(SERVICE_UUID);

                characteristic =
                    await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById("status").innerHTML =
                    "Connected to ESP32";

            }

            catch (error) {

                console.log(error);

                document.getElementById("status").innerHTML =
                    "Connection Failed";
            }
        });


        // Send command to ESP32
        async function sendCommand(command) {

            if (!characteristic) {

                alert("Connect to ESP32 first");
                return;
            }

            const data =
                new TextEncoder().encode(command);

            await characteristic.writeValue(data);

            console.log("Command sent: " + command);
        }


        // Forward
        document.getElementById("forward").addEventListener("mousedown", () => {
            sendCommand("F");
        });

        // Backward
        document.getElementById("backward").addEventListener("mousedown", () => {
            sendCommand("B");
        });

        // Left
        document.getElementById("left").addEventListener("mousedown", () => {
            sendCommand("L");
        });

        // Right
        document.getElementById("right").addEventListener("mousedown", () => {
            sendCommand("R");
        });

        // Stop
        document.getElementById("stop").addEventListener("mousedown", () => {
            sendCommand("S");
        });


        // Automatically stop when button is released
        document.getElementById("forward").addEventListener("mouseup", () => {
            sendCommand("S");
        });

        document.getElementById("backward").addEventListener("mouseup", () => {
            sendCommand("S");
        });

        document.getElementById("left").addEventListener("mouseup", () => {
            sendCommand("S");
        });

        document.getElementById("right").addEventListener("mouseup", () => {
            sendCommand("S");
        });


        // Mobile touch support
        document.getElementById("forward").addEventListener("touchstart", () => {
            sendCommand("F");
        });

        document.getElementById("backward").addEventListener("touchstart", () => {
            sendCommand("B");
        });

        document.getElementById("left").addEventListener("touchstart", () => {
            sendCommand("L");
        });

        document.getElementById("right").addEventListener("touchstart", () => {
            sendCommand("R");
        });

        document.getElementById("forward").addEventListener("touchend", () => {
            sendCommand("S");
        });

        document.getElementById("backward").addEventListener("touchend", () => {
            sendCommand("S");
        });

        document.getElementById("left").addEventListener("touchend", () => {
            sendCommand("S");
        });

        document.getElementById("right").addEventListener("touchend", () => {
            sendCommand("S");
        });

    </script>

</body>
</html>
